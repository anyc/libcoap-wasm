worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;

    server {
        listen 8080;
        server_name _;
        root /srv/project;
        add_header Cache-Control "no-store" always;

        location = / {
            try_files /web/coap-explorer.html =404;
        }

        location = /.well-known/coap {
            proxy_pass http://127.0.0.1:5684;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
            proxy_read_timeout 1h;
        }

        location ~ ^/(web/coap-explorer\.html|src/(libcoap|coap-link-format|coap-websocket-adapter)\.js|dist/libcoap-wasm\.(js|wasm))$ {
            try_files $uri =404;
        }

        location / {
            return 404;
        }
    }
}
