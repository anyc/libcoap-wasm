name: Release

on:
  push:
    tags:
      - '**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Build and test tagged web assets
        env:
          CONTAINER_RUNTIME: docker
        run: ./run-tests.sh --browser
      - name: Package web release
        id: package
        run: |
          archive=$(./scripts/package-release.sh "$GITHUB_REF_NAME")
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$RELEASE_ARCHIVE" \
            --verify-tag --generate-notes
